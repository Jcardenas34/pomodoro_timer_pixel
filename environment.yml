# Conda environment for running Pixel Pomodoro from WSL (Linux) via WSLg.
#   conda env create -f environment.yml && conda activate pixel-pomodoro
name: pixel-pomodoro
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pillow
  - pytest
  - pyqtwebengine   # Qt WebEngine with its own libraries; no apt packages needed
  - qtpy
  - nodejs=22
  - openjdk=21      # Android builds (Gradle / Android Gradle Plugin need JDK 17+)
  - pip
  - pip:
      - pywebview
      - -e ./backend
